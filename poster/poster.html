<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monday 23 November 2026: the world in one day</title>
<style>
  /* Palette: ink + two paper tones as neutrals, teal as the one core colour, red as the single accent.
     Red marks the day and the lead story only. */
  :root {
    --ink: #15171c;
    --paper: #f3eee3;
    --paper-dark: #e3dac6;
    --teal: #1f5753;
    --red: #d8321c;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { width: 1024px; height: 1024px; overflow: hidden; }
  svg { display: block; width: 1024px; height: 1024px; }
  /* One family: Bahnschrift, a DIN-style grotesque, set condensed so long headlines can stay large.
     It is a wire-service look, and it holds up when the poster is shrunk to a thumbnail. */
  text {
    font-family: "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif;
    font-stretch: 75%;
    font-variation-settings: "wdth" 75, "wght" 700;
    font-weight: 700;
  }
  .day    { font-size: 50px; fill: var(--red); letter-spacing: 1px; }
  .date   { font-size: 112px; fill: var(--paper); letter-spacing: 1px; }
  .kicker { font-size: 32px; fill: var(--paper); letter-spacing: 1px; }
  .tag    { font-size: 22px; letter-spacing: 1.2px; }
  .h-lead { font-size: 70px; fill: var(--ink); }
  .h-big  { font-size: 50px; }
  .h-sm   { font-size: 39px; }
  .h      { font-size: 40px; }
  .sub    { font-size: 25px; }
  .sub-lead { font-size: 36px; fill: var(--ink); }
  .sub-lead2 { font-size: 25px; fill: var(--ink); }
  .brief  { font-size: 24px; }
  .on-ink   { fill: var(--ink); }
  .on-paper { fill: var(--paper); }
  .foot   { font-size: 25px; fill: var(--paper); letter-spacing: 0.4px; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Front page for Monday 23 November 2026: Nvidia reinstates its CEO and the Nasdaq jumps over 6 percent; Ukraine sinks a Russian warship off Libya; Iran says three tankers hit mines in Hormuz; COP31 climate talks end with no deal; the US seeks 1.17 billion dollars stolen in the Binance hack; NATO vows space defence; Spain's top court clears Puigdemont to return; an Indonesian factory fire kills 24; Oxfam says war left Gaza toxic; UK sanctions Myanmar's military leaders; Molly Meldrum dies aged 83; DR Congo reimposes a cobalt export ban.">
  <rect width="1024" height="1024" fill="#15171c"/>

  <!-- Banner: the day and date come first. -->
  <text class="day" x="28" y="58">MONDAY</text>
  <text class="kicker" x="996" y="58" text-anchor="end">THE WORLD IN ONE DAY</text>
  <text class="date" x="22" y="146">23 NOVEMBER 2026</text>

  <!-- 1. Lead: Nvidia and the Nasdaq (Americas, markets). Largest tile, the only one with the accent bar. -->
  <g transform="translate(12 164)">
    <rect width="620" height="240" fill="#f3eee3"/>
    <rect width="620" height="12" fill="#d8321c"/>
    <text class="tag" x="28" y="46" fill="#d8321c">AMERICAS · MARKETS</text>
    <text class="h-lead" x="28" y="108">Nvidia reinstates</text>
    <text class="h-lead" x="28" y="170">CEO Jensen Huang</text>
    <text class="sub-lead" x="28" y="208">Nasdaq jumps over 6%.</text>
    <text class="sub-lead2" x="28" y="233">Seoul's Kospi fell 3.3% earlier in the day.</text>
    <!-- Rising bars: a market that jumped. -->
    <g transform="translate(520 170) scale(0.72)">
      <rect x="0" y="52" width="26" height="36" fill="#15171c"/>
      <rect x="32" y="30" width="26" height="58" fill="#15171c"/>
      <rect x="64" y="2" width="26" height="86" fill="#d8321c"/>
    </g>
  </g>

  <!-- 2. Ukraine sinks a Russian warship off Libya (Europe and Africa, war). -->
  <g transform="translate(640 164)">
    <rect width="372" height="240" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="40">EUROPE · AFRICA · WAR</text>
    <text class="h-big on-paper" x="24" y="104">Ukraine sinks a</text>
    <text class="h-big on-paper" x="24" y="154">Russian warship</text>
    <text class="h-big on-paper" x="24" y="204">off Libya</text>
    <!-- Hull going down by the stern on a line of waves. -->
    <g transform="translate(296 150) scale(1.0)" fill="#f3eee3">
      <g transform="rotate(-14 30 30)">
        <polygon points="4,34 56,34 48,46 12,46"/>
        <rect x="22" y="24" width="18" height="10"/>
        <rect x="29" y="12" width="3" height="12"/>
        <rect x="38" y="18" width="10" height="3"/>
      </g>
      <path d="M0 54 q7.5 -7 15 0 t15 0 t15 0 t15 0" fill="none" stroke="#f3eee3" stroke-width="4"/>
    </g>
    <text class="sub on-paper" x="24" y="232">Zelensky confirms the strike.</text>
  </g>

  <!-- 3. Iran and Hormuz (Middle East, war and oil). -->
  <g transform="translate(12 412)">
    <rect width="496" height="168" fill="#e3dac6"/>
    <text class="tag on-ink" x="24" y="36">MIDDLE EAST · WAR AND OIL</text>
    <text class="h on-ink" x="24" y="88">Iran says 3 tankers</text>
    <text class="h on-ink" x="24" y="130">hit mines in Hormuz</text>
    <text class="sub on-ink" x="24" y="158">US Treasury widens sanctions.</text>
    <!-- Tanker with a flame rising from its deck. -->
    <g transform="translate(412 76) scale(1.15)" fill="#15171c">
      <polygon points="2,38 58,38 50,48 10,48"/>
      <rect x="40" y="26" width="12" height="12"/>
      <path d="M18 36 C11 28 20 24 17 12 C27 18 31 28 25 36Z"/>
    </g>
  </g>

  <!-- 4. COP31 (world, climate). -->
  <g transform="translate(516 412)">
    <rect width="496" height="168" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="36">WORLD · CLIMATE</text>
    <text class="h on-paper" x="24" y="88">COP31 climate talks</text>
    <text class="h on-paper" x="24" y="130">end with no deal</text>
    <text class="sub on-paper" x="24" y="158">A fight over fossil fuels sank them.</text>
    <!-- A globe split by a crack. -->
    <g transform="translate(414 20) scale(1.05)">
      <circle cx="30" cy="30" r="24" fill="none" stroke="#f3eee3" stroke-width="5"/>
      <polyline points="34,2 24,18 38,30 26,44 32,60" fill="none" stroke="#1f5753" stroke-width="7"/>
      <polyline points="34,2 24,18 38,30 26,44 32,60" fill="none" stroke="#f3eee3" stroke-width="2"/>
    </g>
  </g>

  <!-- 5. Binance hack (Americas, crime). -->
  <g transform="translate(12 588)">
    <rect width="330" height="190" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="36">AMERICAS · CRIME</text>
    <text class="h-sm on-paper" x="24" y="86">US seeks $1.17bn</text>
    <text class="h-sm on-paper" x="24" y="128">stolen in Binance</text>
    <text class="h-sm on-paper" x="24" y="170">hack</text>
    <!-- Coin. -->
    <g transform="translate(256 8) scale(0.92)">
      <circle cx="30" cy="30" r="26" fill="#f3eee3"/>
      <text x="30" y="43" text-anchor="middle" fill="#1f5753" style="font-size:40px">$</text>
    </g>
  </g>

  <!-- 6. NATO and space (Europe, security). -->
  <g transform="translate(350 588)">
    <rect width="330" height="190" fill="#f3eee3"/>
    <text class="tag on-ink" x="24" y="36">EUROPE · SECURITY</text>
    <text class="h-sm on-ink" x="24" y="86">NATO vows</text>
    <text class="h-sm on-ink" x="24" y="128">space defence</text>
    <text class="sub on-ink" x="24" y="160">After reports of a Russian</text>
    <text class="sub on-ink" x="24" y="186">nuclear satellite.</text>
    <!-- Satellite. -->
    <g transform="translate(250 8) scale(1.0)" fill="#15171c">
      <g transform="rotate(-35 30 30)">
        <rect x="22" y="22" width="16" height="16"/>
        <rect x="0" y="25" width="17" height="10"/>
        <rect x="43" y="25" width="17" height="10"/>
        <rect x="17" y="29" width="5" height="2"/>
        <rect x="38" y="29" width="5" height="2"/>
      </g>
    </g>
  </g>

  <!-- 7. Puigdemont (Europe, politics and law). -->
  <g transform="translate(688 588)">
    <rect width="324" height="190" fill="#e3dac6"/>
    <text class="tag on-ink" x="24" y="36">EUROPE · LAW</text>
    <text class="h-sm on-ink" x="24" y="86">Spain's top court</text>
    <text class="h-sm on-ink" x="24" y="128">clears Puigdemont</text>
    <text class="h-sm on-ink" x="24" y="170">to come home</text>
    <!-- Gavel. -->
    <g transform="translate(262 2) scale(0.8)" fill="#15171c">
      <g transform="rotate(-40 30 30)">
        <rect x="14" y="8" width="32" height="16" rx="2"/>
        <rect x="27" y="24" width="6" height="30"/>
      </g>
      <rect x="20" y="52" width="38" height="6"/>
    </g>
  </g>

  <!-- 8. Indonesia fire (Asia, disaster). -->
  <g transform="translate(12 786)">
    <rect width="330" height="190" fill="#f3eee3"/>
    <text class="tag on-ink" x="24" y="36">ASIA · DISASTER</text>
    <text class="h-sm on-ink" x="24" y="86">Indonesia factory</text>
    <text class="h-sm on-ink" x="24" y="128">fire kills 24</text>
    <text class="sub on-ink" x="24" y="168">34 workers still missing.</text>
    <!-- Flame. -->
    <g transform="translate(266 4) scale(0.78)">
      <path d="M30 2 C36 16 50 22 46 40 C44 52 36 58 30 58 C22 58 12 52 14 38 C15 30 22 28 22 20 C26 24 28 22 30 2Z" fill="#15171c"/>
      <path d="M30 55 C24 55 22 49 25 43 C27 39 30 39 30 33 C34 37 38 41 36 49 C35 53 33 55 30 55Z" fill="#f3eee3"/>
    </g>
  </g>

  <!-- 9. Gaza (Middle East, conflict and environment). -->
  <g transform="translate(350 786)">
    <rect width="330" height="190" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="36">MIDDLE EAST · CONFLICT</text>
    <text class="h-sm on-paper" x="24" y="86">Oxfam says war</text>
    <text class="h-sm on-paper" x="24" y="128">left Gaza toxic</text>
    <text class="sub on-paper" x="24" y="168">Israel's embassy disputes it.</text>
    <!-- Broken walls and a warning drop. -->
    <g transform="translate(270 4) scale(0.44)">
      <g fill="#f3eee3">
        <polygon points="6,112 6,64 26,52 26,74 44,60 44,112"/>
        <polygon points="54,112 54,86 72,94 72,112"/>
        <rect x="0" y="108" width="120" height="6"/>
      </g>
      <path d="M92 6 C92 6 72 32 72 46 a20 20 0 0 0 40 0 C112 32 92 6 92 6Z" fill="#e3dac6"/>
      <rect x="89" y="26" width="6" height="18" fill="#1f5753"/><rect x="89" y="48" width="6" height="6" fill="#1f5753"/>
    </g>
  </g>

  <!-- 10. Also that day: three shorter stories from Asia, Oceania and Africa. -->
  <g transform="translate(688 786)">
    <rect width="324" height="190" fill="#e3dac6"/>
    <text class="tag on-ink" x="24" y="36">ALSO THE SAME DAY</text>
    <text class="brief on-ink" x="24" y="72">UK sanctions Myanmar's</text>
    <text class="brief on-ink" x="24" y="98">military leaders</text>
    <rect x="24" y="108" width="276" height="2" fill="#15171c"/>
    <text class="brief on-ink" x="24" y="136">Molly Meldrum dies aged 83</text>
    <rect x="24" y="146" width="276" height="2" fill="#15171c"/>
    <text class="brief on-ink" x="24" y="172">DR Congo bans cobalt exports</text>
  </g>

  <!-- Footer: the one claim this page makes about itself. -->
  <text class="foot" x="28" y="1008">Every story here was reported by two or more outlets on 23 November 2026.</text>
</svg>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monday 23 November 2026: the world in one day</title>
<style>
  /* Palette: ink + paper as neutrals, teal as the one core colour, red as the single accent.
     Red marks the day and the lead story only. */
  :root {
    --ink: #15171c;
    --paper: #f3eee3;
    --paper-dark: #e3dac6;
    --teal: #1f5753;
    --red: #d8321c;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { width: 1024px; height: 1024px; overflow: hidden; }
  svg { display: block; width: 1024px; height: 1024px; }
  /* One family: a heavy system grotesque stays readable when the poster is shrunk to a thumbnail. */
  text { font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif; }
  .day    { font-size: 44px; font-weight: 800; fill: var(--red); }
  .date   { font-size: 86px; font-weight: 800; fill: var(--paper); }
  .kicker { font-size: 28px; font-weight: 700; fill: var(--paper); }
  .tag    { font-size: 20px; font-weight: 700; letter-spacing: 0.4px; }
  .h-lead { font-size: 60px; font-weight: 800; fill: var(--ink); }
  .h      { font-size: 44px; font-weight: 800; }
  .h-sm   { font-size: 42px; font-weight: 800; }
  .sub    { font-size: 22px; font-weight: 600; }
  .sub-lead { font-size: 30px; font-weight: 600; }
  .on-ink   { fill: var(--ink); }
  .on-paper { fill: var(--paper); }
  .foot   { font-size: 24px; font-weight: 600; fill: var(--paper); }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Front page for Monday 23 November 2026: Nvidia reinstates its CEO, Zelensky asks NATO to admit Ukraine, Oxfam report on Gaza, UK sanctions Myanmar military leaders, DR Congo reimposes cobalt export ban, Molly Meldrum dies aged 83.">
  <rect width="1024" height="1024" fill="#15171c"/>

  <!-- Banner: the day and date come first. -->
  <text class="day" x="28" y="66">MONDAY</text>
  <text class="kicker" x="996" y="66" text-anchor="end">THE WORLD IN ONE DAY</text>
  <text class="date" x="24" y="152">23 NOVEMBER 2026</text>

  <!-- 1. Lead: Nvidia (Americas, markets). Largest tile, accent bar. -->
  <g transform="translate(12 172)">
    <rect width="636" height="318" fill="#f3eee3"/>
    <rect width="636" height="12" fill="#d8321c"/>
    <text class="tag" x="28" y="56" fill="#d8321c">AMERICAS · MARKETS</text>
    <text class="h-lead" x="28" y="126">Nvidia reinstates</text>
    <text class="h-lead" x="28" y="190">CEO Jensen Huang</text>
    <text class="sub-lead on-ink" x="28" y="254">Wall Street rebounds.</text>
    <!-- Chip with a rising arrow: a processor maker and a market that went up. -->
    <g transform="translate(486 196)">
      <g fill="#15171c">
        <rect x="14" y="26" width="12" height="8"/><rect x="14" y="56" width="12" height="8"/><rect x="14" y="86" width="12" height="8"/>
        <rect x="94" y="26" width="12" height="8"/><rect x="94" y="56" width="12" height="8"/><rect x="94" y="86" width="12" height="8"/>
        <rect x="26" y="14" width="8" height="12"/><rect x="56" y="14" width="8" height="12"/><rect x="86" y="14" width="8" height="12"/>
        <rect x="26" y="94" width="8" height="12"/><rect x="56" y="94" width="8" height="12"/><rect x="86" y="94" width="8" height="12"/>
        <rect x="22" y="22" width="76" height="76"/>
      </g>
      <rect x="36" y="36" width="48" height="48" fill="#d8321c"/>
      <polyline points="44,74 58,60 66,67 78,48" fill="none" stroke="#f3eee3" stroke-width="6" stroke-linejoin="miter"/>
      <polygon points="70,46 82,44 80,56" fill="#f3eee3"/>
    </g>
  </g>

  <!-- 2. Ukraine and NATO (Europe, diplomacy). -->
  <g transform="translate(656 172)">
    <rect width="356" height="318" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="52">EUROPE</text>
    <text class="tag on-paper" x="24" y="78">DIPLOMACY</text>
    <!-- Ring of allied seats with one seat still open: a country asking to be admitted. -->
    <g transform="translate(222 22) scale(0.95)" fill="#f3eee3">
      <circle cx="60" cy="16" r="10"/><circle cx="104" cy="60" r="10"/><circle cx="91.1" cy="91.1" r="10"/>
      <circle cx="60" cy="104" r="10"/><circle cx="28.9" cy="91.1" r="10"/><circle cx="16" cy="60" r="10"/>
      <circle cx="28.9" cy="28.9" r="10"/>
      <circle cx="91.1" cy="28.9" r="8" fill="none" stroke="#f3eee3" stroke-width="5"/>
    </g>
    <text class="h-sm on-paper" x="24" y="172">Zelensky asks</text>
    <text class="h-sm on-paper" x="24" y="218">NATO to admit</text>
    <text class="h-sm on-paper" x="24" y="264">Ukraine</text>
    <text class="sub on-paper" x="24" y="300">NATO Parliamentary Assembly</text>
  </g>

  <!-- 3. Gaza (Middle East, conflict and environment). -->
  <g transform="translate(12 498)">
    <rect width="440" height="240" fill="#e3dac6"/>
    <text class="tag on-ink" x="24" y="44">MIDDLE EAST · CONFLICT</text>
    <!-- Broken walls and a warning drop: contamination left by the war, as Oxfam reports. -->
    <g transform="translate(346 10) scale(0.7)">
      <g fill="#15171c">
        <polygon points="6,112 6,64 26,52 26,74 44,60 44,112"/>
        <polygon points="54,112 54,86 72,94 72,112"/>
        <rect x="0" y="108" width="120" height="6"/>
      </g>
      <path d="M92 6 C92 6 72 32 72 46 a20 20 0 0 0 40 0 C112 32 92 6 92 6Z" fill="#1f5753"/>
      <rect x="89" y="26" width="6" height="18" fill="#f3eee3"/><rect x="89" y="48" width="6" height="6" fill="#f3eee3"/>
    </g>
    <text class="h on-ink" x="24" y="132">Oxfam says war</text>
    <text class="h on-ink" x="24" y="180">left Gaza toxic</text>
    <text class="sub on-ink" x="24" y="218">Israel's embassy disputes it.</text>
  </g>

  <!-- 4. Myanmar (Asia, justice). -->
  <g transform="translate(460 498)">
    <rect width="552" height="240" fill="#f3eee3"/>
    <text class="tag on-ink" x="24" y="44">ASIA · JUSTICE</text>
    <text class="h on-ink" x="24" y="108">UK sanctions Myanmar</text>
    <text class="h on-ink" x="24" y="156">military leaders</text>
    <text class="sub on-ink" x="24" y="206">After the ICJ genocide ruling.</text>
    <!-- Scales: a court ruling and the penalties that followed. -->
    <g transform="translate(430 118) scale(0.92)" fill="#15171c">
      <circle cx="60" cy="14" r="8"/>
      <rect x="56" y="14" width="8" height="84"/>
      <rect x="30" y="96" width="60" height="8"/>
      <rect x="14" y="26" width="92" height="6"/>
      <g stroke="#15171c" stroke-width="3" fill="none">
        <line x1="22" y1="32" x2="8" y2="68"/><line x1="22" y1="32" x2="36" y2="68"/>
        <line x1="98" y1="32" x2="84" y2="68"/><line x1="98" y1="32" x2="112" y2="68"/>
      </g>
      <path d="M4 68 H40 A18 18 0 0 1 4 68Z"/>
      <path d="M80 68 H116 A18 18 0 0 1 80 68Z"/>
    </g>
  </g>

  <!-- 5. Congo cobalt (Africa, resources). -->
  <g transform="translate(12 746)">
    <rect width="552" height="218" fill="#1f5753"/>
    <text class="tag on-paper" x="24" y="42">AFRICA · RESOURCES</text>
    <text class="h on-paper" x="24" y="104">DR Congo reimposes</text>
    <text class="h on-paper" x="24" y="152">cobalt export ban</text>
    <text class="sub on-paper" x="24" y="192">A new four-month ban.</text>
    <!-- Ore chunks under a ban sign. -->
    <g transform="translate(456 120) scale(0.72)">
      <g fill="#f3eee3">
        <polygon points="8,98 20,74 54,74 66,98"/>
        <polygon points="54,98 66,74 100,74 112,98"/>
        <polygon points="31,70 43,46 77,46 89,70"/>
      </g>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#f3eee3" stroke-width="18"/>
      <line x1="22" y1="98" x2="98" y2="22" stroke="#f3eee3" stroke-width="18"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#15171c" stroke-width="9"/>
      <line x1="22" y1="98" x2="98" y2="22" stroke="#15171c" stroke-width="9"/>
    </g>
  </g>

  <!-- 6. Molly Meldrum (Oceania, culture). -->
  <g transform="translate(572 746)">
    <rect width="440" height="218" fill="#e3dac6"/>
    <text class="tag on-ink" x="24" y="42">OCEANIA · CULTURE</text>
    <text class="h on-ink" x="24" y="104">Molly Meldrum</text>
    <text class="h on-ink" x="24" y="152">dies aged 83</text>
    <text class="sub on-ink" x="24" y="192">Australian music broadcaster.</text>
    <!-- Record: a life spent on popular music. -->
    <g transform="translate(324 96) scale(0.9)">
      <circle cx="60" cy="60" r="54" fill="#15171c"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#e3dac6" stroke-width="2"/>
      <circle cx="60" cy="60" r="32" fill="none" stroke="#e3dac6" stroke-width="2"/>
      <circle cx="60" cy="60" r="20" fill="#1f5753"/>
      <circle cx="60" cy="60" r="4" fill="#e3dac6"/>
    </g>
  </g>

  <!-- Footer: the one claim this page makes about itself. -->
  <text class="foot" x="28" y="1003">Every story here was reported on 23 November 2026.</text>
</svg>
</body>
</html>
